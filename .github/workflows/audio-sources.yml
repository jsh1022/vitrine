name: Audio sources checks
on:
  workflow_dispatch:
  push:
    paths: ['tweak/Sources/Shared/AudioSources/**', 'tweak/Sources/Shared/NetworkProxy/**', 'tweak/Sources/Shared/Lossless/**', 'tweak/Sources/App/Pages.m', 'tweak/Sources/App/ModSettings.x', 'tweak/Sources/Shared/Player/SpeedPitch.*', 'tweak/Sources/Native/Player/**', 'tweak/Sources/Redesigned/Player/**', 'vendor/wireguard/**', 'harness/audio-sources/**', 'harness/lossless/**', '.github/workflows/audio-sources.yml']
  pull_request:
    paths: ['tweak/Sources/Shared/AudioSources/**', 'tweak/Sources/Shared/NetworkProxy/**', 'tweak/Sources/Shared/Lossless/**', 'tweak/Sources/App/Pages.m', 'tweak/Sources/App/ModSettings.x', 'tweak/Sources/Shared/Player/SpeedPitch.*', 'tweak/Sources/Native/Player/**', 'tweak/Sources/Redesigned/Player/**', 'vendor/wireguard/**', 'harness/audio-sources/**', 'harness/lossless/**', '.github/workflows/audio-sources.yml']
jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/wireguard/go.mod
          cache-dependency-path: vendor/wireguard/go.sum
      - run: go test -race ./...
        working-directory: vendor/wireguard
  ios-sources:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v5
        with:
          repository: theos/logos
          path: .check-tools/logos
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/wireguard/go.mod
          cache-dependency-path: vendor/wireguard/go.sum
      - run: MIN_IOS=16.0 bash vendor/wireguard/build-ios.sh
      - run: bash harness/audio-sources/check.sh
        env:
          LOGOS: ${{ github.workspace }}/.check-tools/logos
      - run: bash harness/audio-sources/presentation-check.sh
        env:
          LOGOS: ${{ github.workspace }}/.check-tools/logos
      - name: Lossless handoff and wired rate negotiation
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          bash harness/lossless/handoff-check.sh
        env:
          THEOS: ${{ github.workspace }}/.check-tools/logos
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: audio-presentation-diagnostics
          path: harness/audio-sources/build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lossless-handoff-diagnostics
          path: harness/lossless/build/handoff/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
